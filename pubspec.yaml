
# The name of our Flutter project.
name: fairshare

# A short description of the application.
description: "FairShare helps groups track shared expenses."

# Prevents accidental publishing to the public Dart package repository.
publish_to: 'none'

# App version: 1.0.0 is the version; +1 is the build number.
version: 1.0.0+1

# Defines the Dart SDK versions this project supports.
# Your installed Dart version is 3.11.3.
environment:
  sdk: ^3.11.3

# --------------------------------------------------
# DEPENDENCIES
# Packages the application needs to run.
# --------------------------------------------------
dependencies:
  # The Flutter SDK provides the app's UI framework.
  flutter:
    sdk: flutter

  # Lets the web build find Flutter's web plugin support.
  flutter_web_plugins:
    sdk: flutter

  # Provides built-in iOS-style icons.
  cupertino_icons: ^1.0.8

  # Connects our app to Firebase services.
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
# --------------------------------------------------
# DEVELOPMENT DEPENDENCIES
# Packages used for testing and code quality.
# --------------------------------------------------
dev_dependencies:
  # Tools for writing and running Flutter tests.
  flutter_test:
    sdk: flutter

  # Checks Dart code for common mistakes.
  flutter_lints: ^6.0.0

# --------------------------------------------------
# FLUTTER SETTINGS
# Flutter-specific project configuration.
# --------------------------------------------------
flutter:
  # Includes the Material Design icon font.
  uses-material-design: true

  # Add image assets here when the app needs them.
  # Example:
  # assets:
  #   - assets/images/logo.png

  # Add custom fonts here if needed in the future.
  # Example:
  # fonts:
  #   - family: MyFont
  #     fonts:
  #       - asset: assets/fonts/MyFont-Regular.ttf
